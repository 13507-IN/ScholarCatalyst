<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="/styles/studentDashboard.css">
</head>
<body>
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
        <h2>Student Dashboard</h2>
        <img id="profile-image" src="default-profile.jpg" alt="Profile Image">
        <ul>
            <li><a href="#profile">Profile</a></li>
            <li><a href="/pages/scholarships.html">Scholarships</a></li>
            <li><a href="/pages/scholarApplication.html">Application</a></li>
            <li><button id="logout-btn">Log Out</button></li>
        </ul>
    </aside>

    <!-- Main Content -->
    <main class="dashboard-main">
        <!-- Profile Section -->
        <section id="profile" class="profile-section">
            <h2>Welcome, <span id="student-name">John Doe</span></h2>
            <div class="profile-card">
                <img id="profile-image" src="default-profile.jpg" alt="Profile Image">
                <div class="profile-details">
                    <p><strong>Email:</strong> <span id="student-email">johndoe@example.com</span></p>
                    <p><strong>Course:</strong> <span id="student-course">Bachelor of Technology</span></p>
                    <p><strong>Year:</strong> <span id="student-year">3rd Year</span></p>
                    <button id="edit-profile-btn">Edit Profile</button>
                </div>
            </div>
        </section>

        <!-- Scholarships Section -->
        <section id="scholarships" class="scholarship-section">
            <h2>Available Scholarships</h2>
            <ul id="scholarship-list">
                <!-- Scholarship details will be loaded here dynamically -->
            </ul>
        </section>
    </main>

    <!-- Edit Profile Modal -->
    <div id="edit-profile-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Edit Profile</h2>
            <form id="edit-profile-form">
                <label for="edit-name">Name:</label>
                <input type="text" id="edit-name" placeholder="Enter your name">

                <label for="edit-email">Email:</label>
                <input type="email" id="edit-email" placeholder="Enter your email">

                <label for="edit-course">Course:</label>
                <input type="text" id="edit-course" placeholder="Enter your course">

                <label for="edit-image">Upload Profile Image:</label>
                <input type="file" id="edit-image" accept="image/*">

                <button type="submit">Save Changes</button>
            </form>
        </div>
    </div>

    <script src="/scripts/studentDashboard.js"></script>
</body>
</html>
